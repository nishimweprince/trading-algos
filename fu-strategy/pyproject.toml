[project]
name = "fu-strategy"
version = "0.1.0"
description = "FastAPI service for FU candle / multi-timeframe strategy logic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "pydantic-settings>=2.5.0,<3",
    "pandas>=2.2.0,<3",
    "numpy>=1.26.0,<3",
    "requests>=2.32.0,<3",
    "pycryptodome>=3.20.0,<4",
    "loguru>=0.7.0,<1",
    "aiosqlite>=0.20.0,<1",
    "websockets>=12.0,<14",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
