[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "session-hedging"
version = "0.1.0"
description = "Session-open hedge backtest and paper service (no live orders)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
session-hedging = "main:run"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
filterwarnings = [
  "error",
  "ignore:Using .httpx. with .starlette.testclient. is deprecated",
  "ignore::ResourceWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = [
  "anchors",
  "api",
  "candles",
  "config",
  "engine",
  "logging_config",
  "main",
  "models",
  "notifier",
  "paper",
  "sessions",
  "validation",
]
