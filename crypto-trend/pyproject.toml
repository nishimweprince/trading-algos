[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# Standalone research package with its own venv (crypto-trend/.venv), like services/solcarry.
# It is not a uv workspace member: the root globs don't match top-level crypto-trend/.
[project]
name = "crypto-trend"
version = "0.1.0"
description = "Out-of-sample test of the rotational Donchian-ensemble crypto trend strategy (Zarattini, Pagani & Barbon 2025). Research only."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "tzdata>=2024.1",
  "matplotlib>=3.8",
]

[project.scripts]
crypto-trend = "crypto_trend.run:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_trend"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
