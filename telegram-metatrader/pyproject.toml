[project]
name = "telegram-metatrader"
version = "0.1.0"
description = "Copy Telegram trade signals into a local MetaTrader 5 terminal."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "MetaTrader5>=5.0.45",
  "Telethon>=1.34.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
telegram-metatrader = "telegram_metatrader.main:run"
telegram-metatrader-login = "telegram_metatrader.cli.login:run"
telegram-metatrader-verify-chat = "telegram_metatrader.cli.verify_chat:run"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

