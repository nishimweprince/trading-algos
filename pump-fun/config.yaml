# pump.fun scalper config (Section 9). Validated with zod at startup.
# Hot-reload is NOT supported — restart to apply changes.
# Secrets NEVER go here. URLs may reference env vars via ${VAR}; the wallet key
# and Telegram token are named by env-var and read from .env / the environment.

mode: paper # paper | dry-run | live

# Verify pinned program IDs exist on-chain at startup. Needs a reachable RPC;
# set false for offline boots / CI.
assertProgramIdsOnChain: true

wallet:
  keypairEnvVar: WALLET_PRIVATE_KEY
  balanceFloorSol: 0.1

rpc:
  # Free Helius tier — the only endpoint needed for Phase 1 detection.
  primaryHttp: ${HELIUS_HTTP_URL}
  pumpportalWs: wss://pumpportal.fun/api/data
  # Paid-tier gRPC (LaserStream). Uncomment + set env vars, then flip
  # detector.grpcEnabled=true, when upgrading toward live.
  # primaryGrpc: ${HELIUS_GRPC_URL}
  # primaryGrpcTokenEnvVar: HELIUS_GRPC_TOKEN
  # Second independent provider for redundant broadcast (Phase 4 / live).
  # secondaryHttp: ${SECONDARY_HTTP_URL}

detector:
  pumpportalEnabled: true # free migration feed (default)
  heliusWsEnabled: true # direct on-chain redundancy (logsSubscribe; reuses HELIUS_HTTP_URL key)
  grpcEnabled: false # requires paid Helius plan + primaryGrpc
  confirmOnChain: true # verify migration tx landed via primaryHttp
  dedupeTtlMs: 300000 # 5 min cross-feed dedupe window
  reconnectBaseMs: 500
  reconnectMaxMs: 30000
  latencyLogEveryN: 10

# Required only in live mode.
# jito:
#   blockEngineUrl: ${JITO_BLOCK_ENGINE_URL}
#   tipCapLamports: 2000000

entry:
  baseSizeSol: 0.25
  maxSizeSol: 0.35
  maxSlippagePct: 5
  minEntryScore: 60

guardrails:
  top10HolderCapPct: 25
  singleHolderCapPct: 8
  creatorHoldingsCapPct: 5
  minPoolSol: 25
  maxBuyImpactPct: 3
  creatorMaxLaunches7d: 3
  enrichmentBudgetMs: 1500
  rugcheckEnabled: true # advisory soft signal (±15 pts); key from RUGCHECK_API_KEY

exits:
  tp1Pct: 50
  tp1SellFraction: 0.75
  tp2Pct: 100
  trailingArmPct: 25
  trailingGapPct: 15
  trailingGapHighVolPct: 10
  hardStopPct: 20
  tp1MoveStopToPct: 20 # after TP1, move remainder stop to +20%
  timeStopMinutes: 15
  emergencyLpDropPct: 15 # SOL-reserve drop vs recent high that fires EMERGENCY_EXIT
  lpDropWindowTicks: 5 # rolling window (ticks) for the LP-pull high-water mark
  creatorDumpEnabled: true # in-position dev-dump monitor
  creatorDumpThresholdPct: 50 # creator selling >= this % of holdings fires EMERGENCY_EXIT
  ladderRefreshMs: 45000
  ladderSlippageTiers: [2, 5, 10, 25] # pre-signed exit ladder tiers (%), worst last

positions:
  pricePollMs: 1000 # local price poll cadence per open position (free tier)

fees:
  swapFeePct: 0.25 # PumpSwap fee per leg — paper PnL drag
  estPriorityTipSolPerTx: 0.001 # rough priority + Jito tip per tx

risk:
  maxConcurrentPositions: 2
  dailyLossLimitSol: 1.5
  dailyLossLimitWalletPct: 5
  consecutiveLossHalt: 4
  consecutiveLossHaltMinutes: 120
  emergencyExitCount24h: 2
  streamDownGraceMs: 10000

alerts:
  telegramBotTokenEnvVar: TG_BOT_TOKEN
  chatId: 8661715867
  adminUserIds: [8661715867] # gates later-phase /kill + blacklist commands to you

persistence:
  dbPath: ./data/scalper.db
  priceTickRetentionDays: 7

dashboard:
  enabled: true
  host: 127.0.0.1
  port: 8787
  usernameEnvVar: DASHBOARD_USERNAME
  passwordEnvVar: DASHBOARD_PASSWORD
