[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# Standalone research package with its own venv (gotobi/.venv), like services/solcarry.
# It is not a uv workspace member: the root globs don't match top-level gotobi/.
[project]
name = "gotobi"
version = "0.1.0"
description = "Backtest of the USD/JPY Gotobi (TTM 9:55 JST fix) anomaly from Bessho, Sugimoto & Suzuki (arXiv 2301.13204). Research only, no trading."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "holidays>=0.50",
  "matplotlib>=3.8",
  "tzdata>=2024.1",
]

[project.scripts]
gotobi = "gotobi.report:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gotobi"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
