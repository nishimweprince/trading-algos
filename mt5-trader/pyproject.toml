[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mt5-signal-service"
version = "0.1.0"
description = "Authenticated FastAPI service for executing idempotent MetaTrader 5 signals"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
  "MetaTrader5>=5.0.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
mt5-signal-service = "mt5_signal_service.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/mt5_signal_service"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: requires an explicitly configured Windows MT5 demo terminal"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

