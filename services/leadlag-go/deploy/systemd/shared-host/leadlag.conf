# Drop-in for leadlag.service on a host shared with other services (installed by
# `install.sh --shared-host` as /etc/systemd/system/leadlag.service.d/shared-host.conf).
# The dedicated-host layout gives the trader CPUs 2-3 alone (system.conf moves
# everything else to 0-1). On a shared host that would squeeze the other
# services onto half the machine, so the trader runs unpinned at normal
# priority: it must not outrank a live trading process next to it.
[Service]
CPUAffinity=
Nice=0
