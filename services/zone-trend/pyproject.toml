[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "zone-trend"
version = "0.1.0"
description = "Zone-trend swing strategy for Binance USDⓈ-M perps: Vision data, pure core, backtester, live runner"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6",
  "sqlalchemy>=2.0,<3",
  "ta-core",
  "ta-notify",
  # Live venue access goes through the plugin, discovered by entry point.
  "ta-plugin-api",
  "ta-plugin-binance-futures",
]

[tool.uv.sources]
ta-core = { workspace = true }
ta-notify = { workspace = true }
ta-plugin-api = { workspace = true }
ta-plugin-binance-futures = { workspace = true }

# A member's own dev group replaces the root one for `uv sync --package`, so it
# repeats the root tools and adds hypothesis for the property tests.
[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
zt = "zone_trend.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zone_trend"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["integration: needs the network"]
filterwarnings = ["error"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["zone_trend"]
