# jito-arb on the Frankfurt VM (installed as /etc/jito-arb/bot.toml by deploy/install.sh).
# Secrets are not here: HELIUS_API_KEY and LASERSTREAM_ENDPOINT come from /etc/jito-arb/jito-arb.env.
# Live only (dry run removed 17 Nov 2026): start-up checks refuse to run without the hot wallet, executor, armed set
# and lookup tables. Stop sending with the KILL file (docs/GO-LIVE.md).
pools_path = "/var/lib/jito-arb/pools.json"

[mode]
alts_path = "/var/lib/jito-arb/alts.json"       # real lookup tables, written by arm-accounts; live loads them from chain
funding_mode = "flash"
kill_file = "/var/lib/jito-arb/KILL"
armed_path = "/var/lib/jito-arb/armed.json"   # written by live-plan; dry run only counts routes outside it

[helius]
# Preconfirmations (preconfSubscribe on the armed pools): off by default. The feed disconnects for the rest of the
# UTC day once its estimated Helius credits reach the cap, so LaserStream never runs out because of it.
preconf_enabled = false
preconf_daily_credit_cap = 10000000
laserstream_endpoint = "VERIFY"   # overridden by LASERSTREAM_ENDPOINT
rpc_url = "https://mainnet.helius-rpc.com"
api_key_env = "HELIUS_API_KEY"
max_grpc_connections = 8          # plus one wallet/reserve connection; the plan allows 10
resync_lag_ms = 1800000           # RPC refresh of quiet pools is a safety net only (engine.settle_slots keeps them quotable)
shard_size = 6000                 # 8 x 6000 keys: 8,000 pools need ~46,000 (spec suggests 300; not a Helius limit)

[engine]
# Stage 3 limits for the first live test (docs/GO-LIVE.md). They apply in dry run too, so dry run measures what
# live would do.
max_trade_lamports = 2000000000   # 2 SOL per trade while on flash loans
max_bundles_per_slot = 1
tip_state_path = "/var/lib/jito-arb/tip_state.txt"   # learned alpha / p_land survive restarts
alpha_window = 20                 # first landing data is sparse (~14 candidates an hour): adjust every 20, not 50
max_cycles_per_pool = 256         # cycles one pool's update re-prices; 64 was a stopgap before the DLMM clock fix
# A bundle that does not land costs nothing, and dry run never learns p_land (it stays at p_land_init 0.1), so the
# 20k EV default meant net >= 200k. 1k x 0.1 makes min_net (10k) the binding floor: 80 -> 197 slots on Nov 4-5 logs.
min_ev_lamports = 1000


[risk]
max_daily_fee_spend_sol = 0.02   # base + priority fees on landed bundles; sending stops for the day above it
min_sol_float = 0.3              # sending stops (and alerts) below this hot-wallet SOL balance
max_sol_float = 2.0
[jito]
regions = ["frankfurt", "amsterdam"]
# Plain-transaction path (Helius Sender, SWQoS only): each arb also goes out as a priority-fee transaction.
# A failed one pays its fee (base + priority); the bid is at most sender_fee_frac_ppm of gross, and fees burnt by
# failed sends stop the path for the day at sender_daily_fail_cap_lamports. The Helius key is added at startup.
sender_enabled = false
sender_url = "http://fra-sender.helius-rpc.com/fast?swqos_only=true"
sender_tip_lamports = 10000
sender_fee_frac_ppm = 100000
sender_max_cu_price = 5000000
sender_daily_fail_cap_lamports = 50000000
sender_max_consecutive_fail = 50
sender_pause_s = 600
# Astralane Iris: a second plain route, chosen at random per opportunity against Sender when both can pay their
# bid. Free tier tips 0.001 SOL (success only), so it is used only when that is <= astralane_max_tip_share_ppm of
# gross. Key from the ASTRALANE_API_KEY environment variable (jito-arb.env), never written here.
astralane_enabled = false
astralane_url = "http://fr.gateway.astralane.io/iris"
astralane_tip_lamports = 1000000
astralane_max_tip_share_ppm = 500000
# Sender Max: the only route for preconfirmation-triggered plain sends (min tip 0.001 SOL, success only).
sender_max_url = "http://fra-sender.helius-rpc.com/fast"
sender_max_tip_lamports = 1000000
sender_max_tip_frac_ppm = 200000
sender_max_max_tip_share_ppm = 500000

[dex]
raydium_v4_enabled = true
whirlpool_enabled = true          # 204/204 exact (tests/fixtures/parity_whirlpool.json, Helius-funded, 2026-11-04)

[discovery]
# Nov 10: as many pools as the feed allows. The 20 SOL floor and 1,500 cap were untested defaults; the EV gate,
# not the floor, drops small profits. At 1 SOL / 8,000: 29,174 candidates, 17,929 under the floor, 1,373 over the cap.
dlmm_fetch_cap = 20000            # newest eligible DLMM pairs before generic TVL/safety filtering
cpmm_fetch_cap = 15000
min_pool_tvl_sol = 1
max_tracked_pools = 8000
raydium_fetch_cap = 50000         # deepest Raydium v4 pools whose base vault clears the floor

[flash]
# Kamino Main Market reserves for the base mints (wSOL, USDC); see config/dex_programs.toml.
reserves = ["d4A2prbA2whesmvHaL88BH6Ewn5N4bTSU2Ze8P6Bc4Q", "D6q6wuQSrifJKZYpR1M8R4YawnLDtDsMmWM1NbBmgJ59"]

[keys]
hot_wallet_path = "/etc/jito-arb/hot_wallet.json"   # absent: dry run signs with the fixed test key
executor_program_id = "VERIFY"

[obs]
sent_log_path = "/var/lib/jito-arb/sent.jsonl"   # one line per region send and audit verdict (leader, region, rtt)
alert_name = "jito-arb fra"      # Telegram prefix; TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID in jito-arb.env
skip_log_max_per_s = 0           # optional skip-only log cap; signed candidates/outcomes are always kept
metrics_addr = "127.0.0.1"
metrics_port = 9100
log_level = "info"
decision_log_dir = "/var/lib/jito-arb/decisions"

[recorder]
dir = "/var/lib/jito-arb/frames"
