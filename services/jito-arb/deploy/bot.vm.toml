# jito-arb on the Frankfurt VM (installed as /etc/jito-arb/bot.toml by deploy/install.sh).
# Secrets are not here: HELIUS_API_KEY and LASERSTREAM_ENDPOINT come from /etc/jito-arb/jito-arb.env.
# Dry run: this build refuses dry_run = false (phase 4 needs the owner's review, RUNBOOK-VM.md).
pools_path = "/var/lib/jito-arb/pools.json"

[mode]
dry_run = true
funding_mode = "flash"
kill_file = "/var/lib/jito-arb/KILL"

[helius]
laserstream_endpoint = "VERIFY"   # overridden by LASERSTREAM_ENDPOINT
rpc_url = "https://mainnet.helius-rpc.com"
api_key_env = "HELIUS_API_KEY"
max_grpc_connections = 4
shard_size = 1500                 # 4 x 1500 keys: ~1,000 pools need ~5,000 (spec suggests 300; not a Helius limit)

[engine]
max_cycles_per_pool = 256         # cycles one pool's update re-prices (each pool's deepest 256)

[jito]
regions = ["frankfurt", "amsterdam"]

[dex]
raydium_v4_enabled = true
whirlpool_enabled = true          # 204/204 exact (tests/fixtures/parity_whirlpool.json, Helius-funded, 2026-11-04)

[discovery]
min_pool_tvl_sol = 20             # 50 tracked 775 pools, 20 tracks ~984 (with the full Raydium fetch); the EV gate drops small profits
max_tracked_pools = 1500
raydium_fetch_cap = 16000         # every Raydium v4 pool whose base vault clears the floor

[flash]
# Kamino Main Market reserves for the base mints (wSOL, USDC); see config/dex_programs.toml.
reserves = ["d4A2prbA2whesmvHaL88BH6Ewn5N4bTSU2Ze8P6Bc4Q", "D6q6wuQSrifJKZYpR1M8R4YawnLDtDsMmWM1NbBmgJ59"]

[keys]
hot_wallet_path = "/etc/jito-arb/hot_wallet.json"   # absent: dry run signs with the fixed test key
executor_program_id = "VERIFY"

[obs]
metrics_addr = "127.0.0.1"
metrics_port = 9100
log_level = "info"
decision_log_dir = "/var/lib/jito-arb/decisions"

[recorder]
dir = "/var/lib/jito-arb/frames"
