# jito-arb example config. Defaults live in src/core/config.hpp; every key here is optional.
# dry_run stays true until the owner flips it after the phase-2 replay gate and phase-3 validator tests.

[mode]
dry_run = true
funding_mode = "flash"          # flash | own
kill_file = "KILL"
simulate_before_send = true

[helius]
laserstream_endpoint = "VERIFY" # from the Helius dashboard, Frankfurt region
rpc_url = "https://mainnet.helius-rpc.com"
api_key_env = "HELIUS_API_KEY"
max_grpc_connections = 4
shard_size = 300

[jito]
regions = ["frankfurt", "amsterdam"]
tip_min_lamports = 1000
tip_max_lamports = 50000000

[engine]
base_mints = ["So11111111111111111111111111111111111111112", "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"]
max_hops = 3
min_spot_edge = 0.0005
min_ev_lamports = 20000
min_net_lamports = 10000
max_trade_lamports = 500_000_000_000
max_input_fraction = 0.20
target_land_rate = 0.30
max_bundles_per_slot = 3

[dex]
# A DEX is enabled only after its quoter matches the chain exactly on >= 200 sim-parity samples.
raydium_v4_enabled = true       # 313/313 exact (tests/fixtures/parity_raydium_v4.json)
whirlpool_enabled = true        # 204/204 exact (tests/fixtures/parity_whirlpool.json)
cpmm_enabled = true             # Raydium CPMM: 260/260 exact (tests/fixtures/parity_cpmm.json)
pumpswap_enabled = true         # PumpSwap: 530/530 exact, sells and buys (tests/fixtures/parity_pumpswap.json)
clmm_enabled = false            # Raydium CLMM: until tests/fixtures/parity_clmm.json has >= 200 exact samples

[discovery]
min_pool_tvl_sol = 50
max_tracked_pools = 1500
track_cpmm = false              # discover and subscribe CPMM pools before cpmm_enabled (recordings, parity)
track_clmm = false              # discover and subscribe CLMM pools before clmm_enabled
track_pumpswap = false          # derive and subscribe canonical PumpSwap pools before pumpswap_enabled

[flash]
# Kamino Main Market reserves for the base mints (wSOL, USDC); see config/dex_programs.toml.
reserves = ["d4A2prbA2whesmvHaL88BH6Ewn5N4bTSU2Ze8P6Bc4Q", "D6q6wuQSrifJKZYpR1M8R4YawnLDtDsMmWM1NbBmgJ59"]

[risk]
max_daily_fee_spend_sol = 0.2
min_sol_float = 0.3
max_sol_float = 2.0

[keys]
hot_wallet_path = "/etc/jito-arb/hot_wallet.json"
cold_wallet_pubkey = "VERIFY"
executor_program_id = "VERIFY"

[obs]
metrics_addr = "127.0.0.1"
metrics_port = 9100
log_level = "info"

[sim]
holder_seed_path = "harness/holders_seed.json"
# Read-only simulateTransaction of every dry-run bundle's swap legs, paid by a public holder of the base token.
enabled = true
max_per_s = 5
holder_refresh_s = 600
min_payer_lamports = 20000000
