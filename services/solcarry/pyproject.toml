[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "solcarry"
version = "0.1.0"
description = "Gate 1 research package for delta-neutral SOL carry (perp funding vs dated basis). Data only, no trading."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "httpx>=0.27,<1",
  "pandas>=2.2",
  "pyarrow>=17",
  "numpy>=1.26",
  "pydantic>=2.9,<3",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  "matplotlib>=3.8",
  "tenacity>=8.2",
]

[project.scripts]
solcarry = "solcarry.cli:entry"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5",
  "respx>=0.21",
  "hypothesis>=6.100",
  "ruff>=0.8,<1",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "types-PyYAML>=6",
  "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/solcarry"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
# Markdown table builders and caveat prose: wrapping these hurts readability.
"src/solcarry/gate/report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live public endpoints (deselected by default)"]
addopts = "-m 'not network'"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true
