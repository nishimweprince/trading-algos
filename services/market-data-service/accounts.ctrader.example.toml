# Copy to data/accounts.ctrader.toml. Same format as execution-service's
# registry; list only the accounts this process reads quotes from. Instruments
# map the canonical names callers use to the exact broker symbol names
# (`execution-service --discover-symbols` lists them).
default_market_data_account = "forex_demo"

[[accounts]]
alias = "forex_demo"
ctid_trader_account_id = 1 # replace with an authorized demo ctidTraderAccountId
environment = "demo"
instruments = { XAUUSD = "XAUUSD", EURUSD = "EURUSD", GBPUSD = "GBPUSD" }

[[accounts]]
alias = "deriv_demo"
ctid_trader_account_id = 2 # replace with the Deriv cTrader ctidTraderAccountId
environment = "demo"
instruments = { EURUSD = "EURUSD" }
