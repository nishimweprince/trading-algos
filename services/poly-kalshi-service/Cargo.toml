[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
rust_decimal = { version = "1", features = ["serde"] }
polymarket_client_sdk_v2 = { version = "0.8", features = ["clob"] }
alloy = { version = "1.6", default-features = false, features = ["signer-local", "signers", "sol-types"] }
axum = { version = "0.8", features = ["http2"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
secrecy = "0.10"
url = "2"
dotenvy = "0.15"

pk-stats = { path = "crates/pk-stats" }
pk-exec = { path = "crates/pk-exec" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
