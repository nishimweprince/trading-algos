[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls", "json", "query"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
bs58 = "0.5"
helius-laserstream = { version = "=0.10.0", default-features = false }
hmac = "0.12"
sha2 = "0.10"
rust_decimal = { version = "1", features = ["serde"] }
polymarket_client_sdk_v2 = { version = "0.8", features = ["clob", "ctf"] }
alloy = { version = "1.6", default-features = false, features = ["signer-local", "signers", "sol-types"] }
axum = { version = "0.8", features = ["http2"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
secrecy = "0.10"
url = "2"
indexmap = { version = "2", features = ["serde"] }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd", "snap"] }
arrow-array = "60"
arrow-schema = "60"
zip = { version = "2", default-features = false, features = ["deflate"] }
tower-http = { version = "0.6", features = ["compression-gzip", "set-header"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rsa = { version = "0.9", features = ["sha2"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
rand = "0.8"
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "1"
httparse = "1"
core_affinity = "0.8"
flate2 = "1"
zstd = "0.13"
fs2 = "0.4"
tracing-appender = "0.2"
crossbeam-channel = "0.5"
cpu-time = "1"
dotenvy = "0.15"
memmap2 = "0.9"
rustfft = "6"

pk-stats = { path = "crates/pk-stats" }
pk-exec = { path = "crates/pk-exec" }
pk-core = { path = "crates/pk-core" }
pk-engine = { path = "crates/pk-engine" }
pk-tape = { path = "crates/pk-tape" }
pk-svc = { path = "crates/pk-svc" }
pk-feeds = { path = "crates/pk-feeds" }
pk-results = { path = "crates/pk-results" }
pk-research = { path = "crates/pk-research" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
