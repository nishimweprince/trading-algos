<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venue adapter</title><style>
:root{color-scheme:dark;font:14px ui-monospace,SFMono-Regular,Menlo,monospace;background:#0a0d12;color:#d9e2ef}body{margin:0;padding:22px;max-width:1500px}header{display:flex;align-items:center;gap:14px}h1{font-size:22px;margin:0}.pill{padding:5px 9px;border:1px solid #34445a;border-radius:20px}.ok{color:#72e2a7}.bad{color:#ff7885}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:18px}.card{background:#111721;border:1px solid #263346;border-radius:9px;padding:14px;overflow:auto}h2{font-size:13px;color:#87a7cf;text-transform:uppercase;margin:0 0 10px}pre{white-space:pre-wrap;word-break:break-word;margin:0;line-height:1.45}a{color:#83b8ff}</style></head><body>
<header><h1 id="title">Venue adapter</h1><span id="ready" class="pill">loading</span><a href="/">home</a></header><div class="grid"><section class="card"><h2>Feeds & clock</h2><pre id="health"></pre></section><section class="card"><h2>Risk & readiness</h2><pre id="risk"></pre></section><section class="card"><h2>Matches & rule fingerprints</h2><pre id="matches"></pre></section><section class="card"><h2>Books, fair & inventory</h2><pre id="books"></pre></section><section class="card"><h2>Orders & actions</h2><pre id="orders"></pre></section></div>
<script>const venue=location.pathname.includes('hip4')?'hip4':'predict';title.textContent=venue==='hip4'?'Hyperliquid HIP-4':'Predict.fun';const show=(id,v)=>document.getElementById(id).textContent=JSON.stringify(v,null,2);async function poll(){try{const r=await fetch('/api/'+venue+'/status');const x=await r.json();const s=x.status||{};ready.textContent=s.ready?'ready':'not ready';ready.className='pill '+(s.ready?'ok':'bad');show('health',{mode:s.mode,uptime_s:s.uptime_s,clock_offset_ms:s.clock_offset_ms,feeds:s.feeds,deadman_armed:s.deadman_armed,onchain_cancel_pending:s.onchain_cancel_pending});show('risk',{latched:s.latched,degraded:s.degraded,reconciling:s.reconciling,risk:s.risk});show('matches',s.matches);show('books',{kalshi_fairs:s.kalshi_fairs,books:s.books,inventory:s.inventory,settlements:s.settlements,markouts:s.markouts});show('orders',{orders:s.recent_orders,fills:s.recent_fills,actions:s.recent_actions})}catch(e){ready.textContent='offline';ready.className='pill bad'}setTimeout(poll,2000)}poll()</script></body></html>
