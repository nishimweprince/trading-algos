[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "poly-kalshi-service"
version = "0.1.0"
description = "Kalshi-signal / Polymarket-leg convergence on 15-minute crypto binaries: recorder, window identity, decision, paper venue, settlement ledger"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "websockets>=13",
  # ~2,000 frames a second across both venues: parsing is the hot path.
  "orjson>=3.10",
  # Kalshi signs every request and the WS upgrade with RSA-PSS.
  "cryptography>=42",
  "ta-core[web]",
  "ta-notify",
]

[tool.uv.sources]
ta-core = { workspace = true }
ta-notify = { workspace = true }

[project.optional-dependencies]
# Replay, null battery, the gate read-out and the Helix tape decoder. CI installs it.
research = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=17", "zstandard>=0.22"]

[project.scripts]
poly-kalshi-service = "poly_kalshi_service.main:run"
pk-status = "poly_kalshi_service.status_app:run"
pk-observer = "poly_kalshi_service.observer:run"
pk-unit-alert = "poly_kalshi_service.unit_alert:main"

[tool.hatch.build.targets.wheel]
packages = ["src/poly_kalshi_service"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = ["integration: needs the network"]
filterwarnings = [
  "error",
  "ignore:.*asyncio\\.get_event_loop_policy.*:DeprecationWarning",
  "ignore:.*asyncio\\.set_event_loop_policy.*:DeprecationWarning",
  "ignore:Using .httpx. with .starlette.testclient. is deprecated",
  "ignore::ResourceWarning",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
# status_page.py is one embedded HTML/JS document; its line length is the page's.
extend-per-file-ignores = { "src/poly_kalshi_service/status_page.py" = ["E501"] }

[tool.ruff.lint.isort]
known-first-party = ["poly_kalshi_service", "research"]
