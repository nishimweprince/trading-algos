# Walk-forward top-20 strategies (copied from Docs/Walk Forward/config, 2026-11-17). Lots set by the owner.
# Defaults common to all strategies:
defaults:
  venue: ftmo_wf_demo            # execution-service :8010 alias, FTMO $100k cTrader demo (hedging)
  take_profit_R: 2.0
  max_hold_market_minutes: 2880  # 48h of trading time
  friday_flat_research_time: "16:45"   # = 21:45 UTC
  no_entry_research_time: ["16:00", "18:59"]  # = 21:00-23:59 UTC
  max_entry_delay_minutes: 30
  one_position_per_strategy: true
  strategies_independent: true   # no netting / dedupe across strategies
  kill_rule: {min_trades: 60, disable_if_cum_R_below: 0.0}
  research_clock_utc_offset_hours: -5   # EST fixed, no DST
pip_size: {XAUUSD: 0.10, USDJPY: 0.01, AUDUSD: 0.0001}
research_cost: {XAUUSD: 0.30, USDJPY: 0.008, AUDUSD: 0.00008}   # price units, round trip; used in signal qualification only
strategies:
  - id: S01
    name: "Gold double bottom 10M, 1H trend, k5"
    symbol: XAUUSD
    enabled: true
    engine: patterns
    timeframes: [10min]
    patterns: [double_bottom]
    pivot_k: 5
    trend_filter: 1H
    qualification: risk_atr_and_3x_cost
    confluence_window_minutes: null
    stop_pips: 80
    take_profit_pips: 160
    lots: 0.10   # owner, 2026-11-17 (FTMO $100k demo)
    source: wf_s01   # execution-service source == cTrader label
    backtest: {trades: 165, per_month: 2.0, win: 0.485, mean_R: 0.337, t: 3.03, years_positive: "6/7"}
