[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "execution-service"
version = "0.2.0"
description = "Broker-agnostic market-data and durable trade-execution gateway"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "sse-starlette>=2.1,<3",
  # Message classes are generated from the schemas vendored in proto/ rather
  # than taken from ctrader-open-api, which hard-pins protobuf==3.20.1 (no
  # wheels for Python 3.11+) and drags in Twisted. See proto/README.md.
  "protobuf>=5.26,<7",
  "ta-core",
  "ta-contracts",
  "ta-store",
  "ta-notify",
]

[tool.uv.sources]
ta-core = { workspace = true }
ta-contracts = { workspace = true }
ta-store = { workspace = true }
ta-notify = { workspace = true }

[project.optional-dependencies]
# Windows only. Guarded by a marker AND kept out of the default dependency set,
# because a macOS install must never try to resolve it.
mt5 = ["MetaTrader5>=5.0.0; sys_platform == 'win32'"]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  # Only needed to regenerate src/ctrader/_generated/ via
  # scripts/generate_protos.sh; the generated modules are committed.
  "grpcio-tools>=1.60",
]

[project.scripts]
execution-service = "execution_service.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/execution_service"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["integration: requires a live cTrader demo account and network access"]
# Warnings are errors so a deprecation that becomes fatal on a newer interpreter
# fails here rather than in production. requires-python allows up to 3.14, which
# CI does not yet run; this is what covers the gap.
filterwarnings = [
  "error",
  # Raised by fastapi.testclient on import; not ours to fix. Matched by message
  # rather than category because resolving the category imports the very module
  # that emits it.
  "ignore:Using .httpx. with .starlette.testclient. is deprecated",
  # pytest-asyncio leaves its per-module loop for the garbage collector, so the
  # first sync test to run after an async module reports the unclosed loop and
  # its two selector socketpair FDs. Reproducible with a one-line async test
  # followed by any sync module, so it tracks the harness, not this service.
  "ignore::ResourceWarning",
]

[tool.ruff]
extend = "../../pyproject.toml"
# Machine-generated by scripts/generate_protos.sh; never hand-edited.
extend-exclude = ["src/execution_service/adapters/ctrader/_generated"]

[tool.ruff.lint.isort]
known-first-party = ["execution_service"]
