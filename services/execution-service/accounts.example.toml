# Copy to data/accounts.production.toml and replace every sample account ID and
# exact broker symbol. `ctrader-markets --profile forex --discover-accounts`
# lists the accounts already authorized by the OAuth grant. In production every
# token-authorized entry below is loaded, and cTrader's isLive flag overrides a
# stale environment value. The enabled field remains for non-production
# profiles and backward compatibility; it is not a production discovery gate.
# This registry is cTrader-only. MT5 profiles select their JSON symbol manifest
# with SYMBOLS_FILE in .env.<profile>.
default_market_data_account = "forex_demo"

[[accounts]]
alias = "forex_demo"
ctid_trader_account_id = 1 # replace with an authorized demo ctidTraderAccountId
environment = "demo"
enabled = true
# Gold-only trading. Change the broker value if this account uses a suffix.
instruments = { XAUUSD = "XAUUSD" }

[[accounts]]
alias = "deriv_demo"
ctid_trader_account_id = 2 # replace with an authorized demo ctidTraderAccountId
environment = "demo"
enabled = true
# These are examples only. Use exact names returned by the Deriv cTrader account.
instruments = { EURUSD = "EURUSD" }

[[accounts]]
alias = "forex_live"
ctid_trader_account_id = 3 # replace with an authorized live ctidTraderAccountId
environment = "live"
enabled = false
# Gold-only trading. Change the broker value if this account uses a suffix.
instruments = { XAUUSD = "XAUUSD" }

[[accounts]]
alias = "deriv_live"
ctid_trader_account_id = 4 # replace with an authorized live ctidTraderAccountId
environment = "live"
enabled = false
instruments = { EURUSD = "EURUSD" }
