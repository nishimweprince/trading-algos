[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ta-core"
version = "0.1.0"
description = "Service scaffolding shared by every Python service: errors, structured logging, settings base, FastAPI app factory, CLI bootstrap"
readme = "README.md"
requires-python = ">=3.11,<3.15"
# The base install is deliberately light: errors, structured logging and the
# settings base need nothing but pydantic-settings. That matters because the
# adopters outside services/ -- ipda, lux-algo -- want log_event and nothing
# else, and lux-algo is a poller with no HTTP server at all. Making them carry
# FastAPI and uvicorn to get a JSON log formatter is what kept ta-core from
# being adoptable outside this directory.
dependencies = [
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
# The FastAPI app factory (app.py) and the uvicorn CLI bootstrap (cli.py).
# Every real HTTP service wants this; declare ta-core[web].
web = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
]
# ta-core's own tests cover app.py and cli.py, so they need the web surface.
dev = [
  "ta-core[web]",
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ta_core"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "error",
  "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["ta_core"]
