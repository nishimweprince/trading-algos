[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ta-clients"
version = "0.1.0"
description = "Typed HTTP clients for this platform's own services"
readme = "README.md"
requires-python = ">=3.11,<3.15"
# ta-contracts arrived with CandleStore: Candle, CandlesResponse, Timeframe and
# TIMEFRAME_MINUTES all live there. ta-contracts does not depend on ta-clients,
# so this edge does not invert the package graph. pydantic comes with it.
dependencies = [
  "httpx>=0.27,<1",
  "ta-contracts",
]

[tool.uv.sources]
ta-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ta_clients"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["ta_clients"]
