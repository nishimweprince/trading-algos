[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ta-notify"
version = "0.1.0"
description = "The one notification-service client"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  # log_event only -- deliberately NOT ta-core[web]: a notification client
  # has no reason to pull FastAPI into a caller that has no HTTP server.
  "ta-core",
]

[tool.uv.sources]
ta-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ta_notify"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["ta_notify"]
