# Workspace root for the Python half of trading-algos.
#
# This is a virtual root: it is never built or published, it exists to hold the
# workspace member list, the single resolved lockfile, and the lint settings
# every member shares. Members opt into those settings with
# `[tool.ruff] extend = "../../pyproject.toml"`, because ruff resolves
# configuration from the nearest pyproject.toml with a [tool.ruff] table rather
# than merging up the tree on its own.
[project]
name = "trading-algos"
version = "0.0.0"
description = "Workspace root. Not a distributable; see services/ and packages/."
requires-python = ">=3.11,<3.15"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
# Globbed rather than enumerated so a new service joins the workspace by
# existing, which is the point of the restructure.
#
# plugins/* holds the broker and exchange providers (ta-plugin-*). Services
# never import them by name to construct a broker; they discover them through
# the ta.market_data and ta.execution entry-point groups (see ta-plugin-api).
#
# The explicit entries are the section 3.5 adopters. They are top-level
# projects that section 1 originally kept OUT of the workspace ("keep their own
# virtualenvs"); that decision is reversed here, because retiring their
# duplicated notifier/logging code means depending on ta-core and ta-notify, and
# `workspace = true` sources only resolve for members. (lux-algo was the third,
# and left the workspace when the project was deleted.)
#
# lookup-trader's package is in server/, not at the project root.
members = [
  "services/*",
  "packages/*",
  "plugins/*",
  "ipda",
  "lookup-trader/server",
]
# notification-service and ta-market-data-js are TypeScript and have no
# pyproject.toml; a glob that matched them would fail resolution. They are
# npm projects driven from the root package.json.
exclude = ["services/notification-service", "packages/ta-market-data-js"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "httpx>=0.27,<1",
]
