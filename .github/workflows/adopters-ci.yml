# CI for the top-level projects that joined the workspace during migration
# section 3.5. They are not services/ members, but they consume ta-core and
# ta-notify, so the same lint-and-test gate applies -- that gate is what keeps a
# shared-package change from silently breaking them.
name: adopters

on:
  push:
  pull_request:

jobs:
  ipda:
    uses: ./.github/workflows/_python-service.yml
    with:
      package: ipda-signal-service
      working-directory: ipda

  lookup-trader-server:
    uses: ./.github/workflows/_python-service.yml
    with:
      package: lookup-trader-server
      working-directory: lookup-trader/server
