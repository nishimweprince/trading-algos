name: execution-service

on:
  push:
  pull_request:

jobs:
  test:
    uses: ./.github/workflows/_python-service.yml
    with:
      package: execution-service
      working-directory: services/execution-service
      # It still drives the protobuf stack end to end (gateway and session
      # tests), so it keeps the interpreter matrix the cTrader plugin runs.
      python-versions: '["3.11", "3.12", "3.13"]'
