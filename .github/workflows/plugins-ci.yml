# One caller per broker plugin under plugins/. The protobuf runtime is the most
# likely thing to break on a new interpreter, so cTrader runs the full matrix.
name: plugins

on:
  push:
  pull_request:

jobs:
  ta-plugin-ctrader:
    uses: ./.github/workflows/_python-service.yml
    with:
      package: ta-plugin-ctrader
      working-directory: plugins/ctrader
      python-versions: '["3.11", "3.12", "3.13"]'

  ta-plugin-mt5:
    uses: ./.github/workflows/_python-service.yml
    with:
      package: ta-plugin-mt5
      working-directory: plugins/mt5

  ta-plugin-binance:
    uses: ./.github/workflows/_python-service.yml
    with:
      package: ta-plugin-binance
      working-directory: plugins/binance

  ta-plugin-binance-futures:
    uses: ./.github/workflows/_python-service.yml
    with:
      package: ta-plugin-binance-futures
      working-directory: plugins/binance-futures

  # Services reach brokers only through load_providers factories; this fails
  # the build if application code constructs a provider or imports a broker SDK.
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 infra/check_plugin_boundary.py
