name: leadlag-go

on:
  push:
    paths:
      - services/leadlag-go/**
      - .github/workflows/leadlag-go-ci.yml
  pull_request:
    paths:
      - services/leadlag-go/**
      - .github/workflows/leadlag-go-ci.yml

defaults:
  run:
    working-directory: services/leadlag-go

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/leadlag-go/go.mod
          cache-dependency-path: services/leadlag-go/go.sum
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - run: go test -race ./...
      # Benchmarks run once so a hot-path regression shows in the log; the
      # allocation budget itself is enforced by AllocsPerRun tests above.
      - run: go test -run '^$' -bench . -benchtime 1x ./...
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/bin/ ./cmd/...
