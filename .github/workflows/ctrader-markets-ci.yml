name: ctrader-markets CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The protobuf runtime is the most likely thing to break on a new
        # interpreter, and tests/test_proto.py is the canary for it.
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: ctrader-markets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ctrader-markets/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not integration"
