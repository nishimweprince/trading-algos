# mt5-trader is frozen; see mt5-trader/FROZEN.md. This keeps running until the
# Windows host cuts over to execution-service with ADAPTERS=mt5.
name: mt5-trader (frozen)

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mt5-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mt5-trader/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not integration"
