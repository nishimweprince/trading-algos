[package]
name = "pd-collect"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"
futures = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
solana-pubkey = { version = "2.2", features = ["curve25519"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
yellowstone-grpc-client = "9"
yellowstone-grpc-proto = "9"
zstd = "0.13"

[profile.release]
opt-level = 3
