# pump-desk: low-latency networking on a dedicated trading instance.
# Busy-poll the NIC queue on blocking reads (µs, per socket default).
net.core.busy_read = 50
net.core.busy_poll = 50
# Bigger socket buffers for the gRPC stream bursts.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 1048576 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
# Keep warm connections warm.
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_keepalive_time = 30
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 3
net.ipv4.tcp_low_latency = 1
net.ipv4.tcp_fastopen = 3
# No swapping of the locked trading process.
vm.swappiness = 1
