[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lookup-trader-server"
version = "0.1.0"
description = "Bar replay and manual trade labelling API"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "duckdb>=1.1,<2",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "pyarrow>=18,<20",
  "scikit-learn>=1.5,<2",
  # Tabular gradient boosting for the meta-model, with chronological tuning.
  # Trees still beat deep learning at this size, and CatBoost's ordered boosting
  # is specifically aimed at the small-n target leakage this dataset risks.
  "catboost>=1.2,<2",
  "optuna>=4.0,<5",
  "joblib>=1.4,<2",
  "python-multipart>=0.0.12,<1",
  "eval_type_backport>=0.2,<1",
  # Delivery for meta_event_notifications. The base ta-core arrives with it;
  # the web extra is not needed, this project brings its own FastAPI.
  "ta-notify",
]

[tool.uv.sources]
ta-notify = { workspace = true }

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.27,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
