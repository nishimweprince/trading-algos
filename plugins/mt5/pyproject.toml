[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ta-plugin-mt5"
version = "0.1.0"
description = "MetaTrader 5 provider plugin: terminal wrapper, symbol manifest, test double"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["pydantic>=2.9,<3", "ta-plugin-api"]

[tool.uv.sources]
ta-plugin-api = { workspace = true }

[project.optional-dependencies]
# Windows only. Guarded by a marker AND kept out of the default dependency set,
# because a macOS or Linux install must never try to resolve it.
terminal = ["MetaTrader5>=5.0.0; sys_platform == 'win32'"]

[project.entry-points."ta.execution"]
mt5 = "ta_plugin_mt5:FACTORY"

[tool.hatch.build.targets.wheel]
packages = ["src/ta_plugin_mt5"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["ta_plugin_mt5"]
