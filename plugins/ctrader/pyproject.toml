[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ta-plugin-ctrader"
version = "0.1.0"
description = "cTrader Open API provider plugin: protobuf wire stack, OAuth token rotation, account registry"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  # Message classes are generated from the schemas vendored in proto/ rather
  # than taken from ctrader-open-api, which hard-pins protobuf==3.20.1 (no
  # wheels for Python 3.11+) and drags in Twisted. See proto/README.md.
  "protobuf>=5.26,<7",
  "ta-contracts",
  "ta-core",
  "ta-plugin-api",
]

[tool.uv.sources]
ta-contracts = { workspace = true }
ta-core = { workspace = true }
ta-plugin-api = { workspace = true }

[project.optional-dependencies]
dev = [
  # Only needed to regenerate src/ta_plugin_ctrader/_generated/ via
  # scripts/generate_protos.sh; the generated modules are committed.
  "grpcio-tools>=1.60",
]

[project.entry-points."ta.execution"]
ctrader = "ta_plugin_ctrader:FACTORY"

[project.entry-points."ta.market_data"]
ctrader = "ta_plugin_ctrader:FACTORY"

[tool.hatch.build.targets.wheel]
packages = ["src/ta_plugin_ctrader"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "error",
  "ignore:.*asyncio\\.get_event_loop_policy.*:DeprecationWarning",
  "ignore:.*asyncio\\.set_event_loop_policy.*:DeprecationWarning",
  "ignore::ResourceWarning",
]

[tool.ruff]
extend = "../../pyproject.toml"
# Machine-generated by scripts/generate_protos.sh; never hand-edited.
extend-exclude = ["src/ta_plugin_ctrader/_generated"]

[tool.ruff.lint.isort]
known-first-party = ["ta_plugin_ctrader"]
